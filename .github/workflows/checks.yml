# Автоматические проверки PR. Статус-проверка `checks` обязательна для merge в main.
# Запуск локально: python tools/check_repo.py (тот же результат).
name: checks

on:
  pull_request:

permissions:
  contents: read            # проверки только читают репозиторий

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Действия закреплены по полному SHA коммита (тег можно переназначить, SHA — нет).
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install check dependencies
        run: python -m pip install pyyaml
      - name: Repository checks
        run: python tools/check_repo.py
