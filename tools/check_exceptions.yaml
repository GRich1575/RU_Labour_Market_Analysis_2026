    line: "**C7:** шаблоны для diff (только добавленные строки): `ghp_[A-Za-z0-9]{36}`, `github_pat_`, `AKIA[0-9A-Z]{16}`, `-----BEGIN .* PRIVATE KEY-----`, `(?i)(password|passwd|api[_-]?key|token)\\s*[:=]\\s*\\S+`. Для полноты предпочтительно готовый сканер (gitleaks) — см. п. 5."
