# Критерии субъектов МСП в РФ — машиночитаемая версия.
#
# Основной источник: ФЗ № 209-ФЗ от 24.07.2007, ред. от 26.06.2026, вступ. в силу с 01.09.2026
#   (файл «Федеральный закон от 24.07.2007 N 209-ФЗ (ред. от 26.06.2026)… - КонсультантПлюс.pdf», ст. 3 п. 12–13, ст. 4 ч. 1–5, ст. 4.1).
#   Прочитано по изображениям страниц 3–8, 2026-11-18. Текст подтверждён.
# Подтверждено: пороги дохода по ПП РФ № 265 от 04.04.2016 (текст КонсультантПлюс, 2026-11-18, без пометок об изменениях): микро 120 млн, малые 800 млн, средние 2 млрд ₽; в силу с 01.08.2016.
# Подтверждено (исходный источник: файл t_0001201711270015.pdf, публикация publication.pravo.gov.ru, номер 0001201711270015, исходная редакция 2017, 7 стр., 2026-11-18): ПП РФ № 1412 от 22.11.2017 — предел численности для лёгкой промышленности 1000 человек; условия — классы 13/14/15, доля доходов ≥70%, численность >250 и ≤1000. Применяемая редакция — от 29.10.2024 (ПП № 1447; сведения legalacts.ru; решение владельца 2026-11-19); дата вступления изменений и сверка с официальным порталом не выполнены.
# Исходная редакция 2007 г. (FZ_209.pdf) заменена: там были «выручка или активы», 2 года, 25% для иностранных.

rule:
  category: max_of_criteria                  # ч. 3 ст. 4: наибольшая из категорий по п. 2, 2.1, 2.2 и ч. 1.1 п. 3
  criteria:
    - income                                  # ч. 1.1 п. 3: доход от предпринимательской деятельности (без активов)
    - headcount                               # ч. 1.1 п. 2: среднесписочная численность работников
  basis_year: previous_calendar_year          # ч. 1.1 п. 2–3
  headcount_basis: average_annual             # ст. 4 ч. 1.1 п. 2; ГПХ, совместители, филиалы — см. ФЗ-209 ст. 4 (ред. 2026)
  currency: RUB
  income_limits_source: ПП РФ № 265 от 04.04.2016 (подтв.)

categories:
  - name: микро
    max_income_rub: 120000000                 # ПП 265 (подтв.)
    headcount_min: 0
    headcount_max: 15                         # ч. 1.1 п. 2 а) (подпункт «а» — малые, микро до 15)
    headcount_exceptions: []
  - name: малое
    max_income_rub: 800000000                 # ПП 265 (подтв.)
    headcount_min: 16
    headcount_max: 100                        # ч. 1.1 п. 2 а)
    headcount_exceptions: []
  - name: среднее
    max_income_rub: 2000000000                # ПП 265 (подтв.)
    headcount_min: 101
    headcount_max: 250                        # ч. 1.1 п. 2 б)
    headcount_exceptions:
      - condition: лёгкая промышленность (ОКВЭД 2, классы 13, 14, 15); доля такого вида деятельности ≥70% доходов
        headcount_max_source: "ч. 1.1 п. 2.1 ст. 4 ФЗ-209; ПП РФ № 1412 от 22.11.2017 — 1000 чел. (п. 1); условия (Правила, п. 2): классы 13, 14, 15 как основной вид, доля доходов от него ≥70%, численность >250 и ≤1000; включение в перечень Минпромторга (формируется ежегодно, не позднее 5 июля) — подтв. по официальной публикации 0001201711270015 (исходная редакция); применяемая редакция от 29.10.2024 (ПП № 1447): заявка до 31 мая, рассмотрение 20 рабочих дней, перечень в налоговую службу до 5 июля"
        headcount_min_applicable: 251
        headcount_max: 1000
      - condition: общественное питание (ОКВЭД 2, класс 56) — основной вид по сведениям ЕГРЮЛ/ЕГРИП на 1-е число месяца внесения в реестр
        headcount_max: 1500                   # ч. 1.1 п. 2.2 (подтв.)

ownership:
  applies_to_legal_forms: [хозяйственные общества (ООО, АО), хозяйственные товарищества, хозяйственные партнёрства]   # ч. 1.1 п. 1
  condition_logic: "хотя бы одно из условий (ч. 1.1 п. 1): либо лимиты долей ниже, либо одно из исключений"
  limits:
    - group: РФ, субъекты РФ, муниципальные образования, общественные и религиозные организации, благотворительные и иные фонды (кроме инвестиционных фондов)
      max_share_pct: 25                       # ч. 1.1 п. 1 а)
    - group: иностранные юридические лица и юридические лица, не являющиеся субъектами МСП
      max_share_pct: 49                       # ч. 1.1 п. 1 а)
  exemptions:                                  # ч. 1.1 п. 1 б)–ж)
    - id: high_tech_ao
      description: акции АО, обращающиеся на организованном рынке и отнесённые к высокотехнологичному (инновационному) сектору
    - id: rid_implementation
      description: деятельность по внедрению РИД, исключительные права на которые принадлежат бюджетным/автономным научным учреждениям или вузам
    - id: skolkovo
      description: участник проекта «Сколково» (ФЗ № 244-ФЗ)
    - id: innovation_support_list
      description: учредители — юрлица из перечня ПП РФ, предоставляющие господдержку инновационной деятельности (ФЗ № 127-ФЗ)
    - id: disability_orgs
      description: участники ООО — общероссийские общественные объединения инвалидов; инвалиды ≥50% среднесписочной численности и ≥25% фонда оплаты труда
    - id: foreign_participants_exempt
      description: "ограничение суммарной доли общественных объединений инвалидов, иностранных юрлиц и (или) юрлиц, не являющихся субъектами МСП, не распространяется на участников хозяйственных обществ — иностранных юрлиц, у которых доход за предыдущий календарный год не превышает предела для средних предприятий (п. 3 ч. 1.1) и среднесписочная численность не превышает предела по подп. «б» п. 2 (за исключением юрлиц из государств, включённых в перечень офшорных зон по подп. 1 п. 3 ст. 284 НК РФ), а также на хозяйственные общества, соответствующие подп. «б»–«д», «ж»"
      source: ст. 4 ч. 1.1 п. 1 а) (подтв., стр. 4–5 ред. 26.06.2026)

special_rules:
  - id: new_entities
    description: вновь созданные ЮЛ, вновь зарегистрированные ИП, ИП только на ПСН — относятся к микропредприятиям (ч. 3)
    category: микро
    source: ст. 4 ч. 3 (подтв.)
  - id: new_entity_definition
    description: "вновь созданные ЮЛ и ИП — зарегистрированные с 1 декабря предыдущего года по 31 мая текущего года (ст. 3 п. 12–13)"
    source: ст. 3 п. 12–13 (подтв.)
  - id: ip_no_employees_income_basis
    description: ИП, не привлекавшие наёмных работников в предыдущем году, категория — по доходу (ч. 3)
    source: ст. 4 ч. 3 (подтв.)
  - id: skolkovo_intnc_headcount_only
    description: участники «Сколково» и ИНТЦ, освобождённые от сдачи отчётности о доходе, — категория только по численности (ч. 3)
    source: ст. 4 ч. 3 (подтв., стр. 7 PDF ред. 26.06.2026)
    note: "норма внесена ФЗ от 25.05.2026 № 154-ФЗ (отметка в тексте); дата вступления самой нормы на странице не указана; редакция в целом — с 01.09.2026 (заголовок документа)"
  - id: three_year_rule
    description: категория меняется, если пределы по доходу или численности выше/ниже установленных в течение трёх календарных лет подряд (ч. 4)
    applies_to: [income, headcount]
    not_applies_to: [ownership]
    source: ст. 4 ч. 4 (подтв.)
  - id: new_entities_retain
    description: категория вновь созданного ЮЛ/ИП сохраняется или меняется по сведениям реестра с учётом условий ч. 1.1 (ч. 4.1)
    source: ст. 4 ч. 4.1 (подтв.)

ownership_violation_effect: исключение из Единого реестра субъектов МСП (ст. 4.1 ч. 3, при обновлении реестра уполномоченным органом)

registry_source:
  name: Единый реестр субъектов МСП (ФНС России), ст. 4.1 ФЗ-209
  url: https://mmsp.nalog.ru/
  conditions_page: https://mmsp.nalog.ru/about.html?section=conditions
