# Критерии субъектов МСП в РФ — машиночитаемая версия.
# Основа: ФЗ № 209-ФЗ от 24.07.2007, ст. 4; ПП РФ № 265 от 04.04.2016 (предельные доходы);
# ПП РФ № 1412 (лёгкая промышленность). Источник: kriterii_msp_rf.pdf (скачан 2026-11-18).
# Перед использованием в расчётах сверить актуальную редакцию ст. 4 на pravo.gov.ru.

rule:
  category: max_of_revenue_and_headcount   # категория = наибольшая из двух категорий (по доходу и по численности)
  basis_year: previous_calendar_year       # показатели за предыдущий календарный год
  currency: RUB

categories:
  - name: микро
    max_revenue_rub: 120000000
    headcount_min: 0
    headcount_max: 15
    headcount_exceptions: []
  - name: малое
    max_revenue_rub: 800000000
    headcount_min: 16
    headcount_max: 100
    headcount_exceptions: []
  - name: среднее
    max_revenue_rub: 2000000000
    headcount_min: 101
    headcount_max: 250
    headcount_exceptions:
      - condition: хозяйственные общества и партнёрства в сфере лёгкой промышленности (перечень ПП РФ № 1412)
        headcount_max: 1000
      - condition: основной вид деятельности — общественное питание (ОКВЭД 2, класс 56; п. 2.2 ч. 1.1 ст. 4 ФЗ № 209-ФЗ)
        headcount_max: 1500

ownership:
  applies_to_legal_forms: [ООО, АО, хозяйственные товарищества, хозяйственные партнёрства]
  not_applicable_to: [производственные кооперативы, потребительские кооперативы, КФХ, ИП]
  limits:
    - group: РФ, субъекты РФ, муниципальные образования, общественные и религиозные организации, благотворительные и иные фонды (кроме инвестиционных фондов)
      max_share_pct: 25
    - group: иностранные юридические лица и российские юридические лица, не являющиеся субъектами МСП
      max_share_pct: 49
  exemptions:
    - акции АО, обращающиеся на организованном рынке и относящиеся к высокотехнологичному (инновационному) сектору
    - внедрение результатов интеллектуальной деятельности (РИД), права на которые принадлежат бюджетным или автономным научным учреждениям либо образовательным организациям высшего образования
    - участник проекта «Сколково» или поддержка специализированных организаций инновационной инфраструктуры (по перечню ПП РФ)
    - объединения инвалидов (не менее 50% среднесписочной численности инвалидов и не менее 25% фонда оплаты труда)
    - вновь созданные ООО и АО: ограничение 49% не применяется на момент включения в реестр

special_rules:
  - id: new_entities
    description: юридические лица и ИП, зарегистрированные с 1 декабря предыдущего года по 31 мая текущего года
    category: микро
  - id: ip_patent_no_employees
    description: ИП, применяющие исключительно патентную систему налогообложения (ПСН) и не привлекавшие наёмных работников
    category: микро
  - id: revenue_not_reported
    description: организации, освобождённые от сдачи отчётности, по которой определяется доход (участники проекта «Сколково» и ИНТЦ)
    category_basis: headcount_only
    effective_from: 2026-09-01
  - id: three_year_rule
    description: категория меняется (или статус МСП утрачивается) только если предельные значения дохода или численности превышены три календарных года подряд
    applies_to: [revenue, headcount]
    not_applies_to: [ownership]

ownership_violation_effect: исключение из Единого реестра субъектов МСП при ближайшем плановом обновлении реестра ФНС

registry_source:
  name: Единый реестр субъектов МСП (ФНС России)
  url: https://mmsp.nalog.ru/
  conditions_page: https://mmsp.nalog.ru/about.html?section=conditions
