    data_2026: available
    enabled: false
    notes: НЕ сравнивать напрямую с МОТ-безработицей. Данные Роструда за январь–сентябрь 2026 получены через Росстат — таблицы 6 (не занятые граждане и зарегистрированные безработные) и 7 (потребность работодателей, нагрузка на 100 вакансий) раздела 2 PDF «Социально-экономическое положение России, январь–сентябрь 2026»; CSV в data/raw/rosstat_orc/, сверены 2026-11-18. Сайт Роструда напрямую не проверен; разбивка по профессиям не подтверждена; федеральный XLSX не найден

