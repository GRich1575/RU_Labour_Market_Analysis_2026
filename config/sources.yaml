# Реестр источников данных. Один источник = один блок. Все источники остаются в списке.
# status: to_verify — адрес/формат/доступ не подтверждены; verified — проверено вручную.
# data_2026: available — данные за 2026 получены; unverified — не удалось проверить; N/A — данных за 2026 нет.
# enabled: true — использовать в анализе; false — отключён, пока нет данных за 2026.
# Правило: учитываются только данные за 2026 год.
# goal: 1 шоки и инфляция; 2 вакансии/безработные по сферам; 3 МСП; справка — только для сравнения.

sources:
  - id: rosstat_orc
    name: Обследование рабочей силы (ОРС)
    provider: Росстат
    role: база
    goal: [1, 2]
    indicators: безработица по МОТ, занятость, рабочая сила
    access: ЕМИСС (fedstat.ru), публикации rosstat.gov.ru
    format: XLSX / CSV (ЕМИСС), PDF (сборники)
    frequency: ежемесячно; ежеквартально (сборник)
    geography: РФ, федеральные округа, регионы
    status: verified
    data_2026: available
    enabled: false
    notes: раздел 2 «Занятость и безработица» (стр. 196–205) издания «Социально-экономическое положение России, январь–сентябрь 2026» (osn-09_2026.pdf) получен и проверен вручную; CSV в data/raw/rosstat_orc/. ЕМИСС XLSX не подтверждён (rosstat.gov.ru недоступен из среды проверки); ID показателя взять из адреса страницы ЕМИСС; выборочный опрос, погрешность ~2%

