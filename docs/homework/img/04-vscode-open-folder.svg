<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="640" height="340" fill="#e9ecef"/>
  <!-- VS Code window -->
  <rect x="40" y="16" width="560" height="308" rx="8" fill="#1e1e1e" stroke="#555" stroke-width="2"/>
  <rect x="40" y="16" width="560" height="30" rx="8" fill="#323233"/>
  <rect x="40" y="36" width="560" height="10" fill="#323233"/>
  <text x="60" y="37" font-size="14" fill="#ccc">File</text>
  <text x="110" y="37" font-size="14" fill="#ccc">Edit</text>
  <text x="155" y="37" font-size="14" fill="#ccc">Selection</text>
  <!-- File menu open -->
  <rect x="50" y="48" width="14" height="0" fill="none"/>
  <rect x="52" y="22" width="36" height="22" rx="3" fill="#094771"/>
  <text x="60" y="37" font-size="14" fill="#fff">File</text>
  <rect x="52" y="50" width="280" height="172" rx="4" fill="#252526" stroke="#454545" stroke-width="1"/>
  <text x="70" y="78" font-size="14" fill="#ccc">New File...</text>
  <text x="70" y="104" font-size="14" fill="#ccc">Open File...</text>
  <rect x="54" y="116" width="276" height="28" fill="#094771"/>
  <text x="70" y="136" font-size="14" fill="#fff" font-weight="bold">Open Folder...</text>
  <text x="70" y="162" font-size="14" fill="#ccc">Open Recent</text>
  <text x="70" y="188" font-size="14" fill="#ccc">Save</text>
  <!-- editor hint -->
  <text x="360" y="160" font-size="14" fill="#888">Open the folder with the project</text>
  <text x="360" y="180" font-size="14" fill="#888">(RU_Labour_Market_Analysis_2026),</text>
  <text x="360" y="200" font-size="14" fill="#888">not a single file inside it.</text>
  <!-- marker -->
  <g><circle cx="318" cy="130" r="15" fill="#d62728"/><text x="318" y="131" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" dominant-baseline="central">1</text></g>
</svg>
