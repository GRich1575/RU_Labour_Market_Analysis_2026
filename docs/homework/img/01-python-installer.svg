<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="640" height="360" fill="#e9ecef"/>
  <!-- installer window -->
  <rect x="60" y="20" width="520" height="320" rx="8" fill="#fff" stroke="#8a94a0" stroke-width="2"/>
  <rect x="60" y="20" width="520" height="34" rx="8" fill="#3c6e9c"/>
  <rect x="60" y="44" width="520" height="10" fill="#3c6e9c"/>
  <text x="76" y="43" font-size="15" fill="#fff">Python 3.13.x (64-bit) Setup</text>
  <text x="100" y="110" font-size="20" fill="#222" font-weight="bold">Install Python 3.13.x</text>
  <text x="100" y="135" font-size="14" fill="#555">Select Install Now to install Python with default settings.</text>
  <!-- checkbox 1: launcher (default, checked) -->
  <rect x="100" y="180" width="18" height="18" fill="#fff" stroke="#555" stroke-width="2"/>
  <path d="M103 189 L108 194 L116 184" stroke="#2e7d32" stroke-width="3" fill="none"/>
  <text x="130" y="194" font-size="14" fill="#333">Install launcher for all users (recommended)</text>
  <!-- checkbox 2: PATH (MUST be checked) -->
  <rect x="100" y="216" width="18" height="18" fill="#2e7d32" stroke="#2e7d32" stroke-width="2"/>
  <path d="M103 225 L108 230 L116 220" stroke="#fff" stroke-width="3" fill="none"/>
  <text x="130" y="230" font-size="15" font-weight="bold" fill="#222">Add python.exe to PATH</text>
  <!-- install button -->
  <rect x="260" y="290" width="240" height="36" rx="4" fill="#2b6cb0"/>
  <text x="380" y="313" font-size="16" fill="#fff" text-anchor="middle">Install Now</text>
  <text x="100" y="313" font-size="14" fill="#2b6cb0">Customize installation</text>
  <!-- markers -->
  <g><circle cx="78" cy="225" r="15" fill="#d62728"/><text x="78" y="226" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" dominant-baseline="central">1</text></g>
  <g><circle cx="512" cy="288" r="15" fill="#d62728"/><text x="512" y="289" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" dominant-baseline="central">2</text></g>
</svg>
