<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="640" height="300" fill="#e9ecef"/>
  <!-- Settings window -->
  <rect x="40" y="20" width="560" height="260" rx="8" fill="#fff" stroke="#8a94a0" stroke-width="2"/>
  <text x="70" y="62" font-size="20" font-weight="bold" fill="#222">App execution aliases</text>
  <text x="70" y="86" font-size="13" fill="#666">(Russian Windows: Псевдонимы выполнения приложений)</text>
  <line x1="60" y1="100" x2="580" y2="100" stroke="#ddd" stroke-width="1"/>
  <!-- row 1: python.exe -->
  <text x="70" y="140" font-size="15" fill="#333">App Installer  python.exe</text>
  <rect x="500" y="124" width="56" height="28" rx="14" fill="#c4c9d0"/>
  <circle cx="520" cy="138" r="11" fill="#fff"/>
  <text x="566" y="143" font-size="13" fill="#666">Off</text>
  <!-- row 2: python3.exe -->
  <text x="70" y="190" font-size="15" fill="#333">App Installer  python3.exe</text>
  <rect x="500" y="174" width="56" height="28" rx="14" fill="#c4c9d0"/>
  <circle cx="520" cy="188" r="11" fill="#fff"/>
  <text x="566" y="193" font-size="13" fill="#666">Off</text>
  <line x1="60" y1="215" x2="580" y2="215" stroke="#ddd" stroke-width="1"/>
  <text x="70" y="250" font-size="13" fill="#555">Both switches must be Off. Then close Settings.</text>
  <!-- markers -->
  <g><circle cx="470" cy="138" r="15" fill="#d62728"/><text x="470" y="139" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" dominant-baseline="central">1</text></g>
  <g><circle cx="470" cy="188" r="15" fill="#d62728"/><text x="470" y="189" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" dominant-baseline="central">2</text></g>
</svg>
