<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="640" height="340" fill="#e9ecef"/>
  <rect x="40" y="16" width="560" height="308" rx="8" fill="#fff" stroke="#8a94a0" stroke-width="2"/>
  <text x="70" y="52" font-size="19" font-weight="bold" fill="#222">New personal access token (classic)</text>
  <!-- note field -->
  <text x="70" y="88" font-size="13" fill="#555">Note</text>
  <rect x="70" y="96" width="500" height="32" rx="4" fill="#fff" stroke="#8a94a0" stroke-width="2"/>
  <text x="84" y="117" font-size="14" fill="#222">project-clone</text>
  <!-- expiration -->
  <text x="70" y="150" font-size="13" fill="#555">Expiration</text>
  <rect x="70" y="158" width="240" height="32" rx="4" fill="#fff" stroke="#8a94a0" stroke-width="2"/>
  <text x="84" y="179" font-size="14" fill="#222">30 days</text>
  <!-- scope repo -->
  <rect x="70" y="208" width="18" height="18" fill="#2e7d32" stroke="#2e7d32" stroke-width="2"/>
  <path d="M73 217 L78 222 L86 212" stroke="#fff" stroke-width="3" fill="none"/>
  <text x="98" y="223" font-size="14" fill="#222">repo  (Full control of private repositories)</text>
  <!-- generate button -->
  <rect x="70" y="250" width="200" height="36" rx="4" fill="#2e7d32"/>
  <text x="170" y="273" font-size="15" fill="#fff" text-anchor="middle">Generate token</text>
  <!-- warning: copy once -->
  <rect x="290" y="244" width="290" height="50" rx="6" fill="#fff8e1" stroke="#b7791f" stroke-width="2"/>
  <text x="302" y="265" font-size="13" fill="#7a4f00">Copy the token now.</text>
  <text x="302" y="284" font-size="13" fill="#7a4f00">You will not see it again.</text>
  <!-- markers -->
  <g><circle cx="282" cy="268" r="15" fill="#d62728"/><text x="282" y="269" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" dominant-baseline="central">1</text></g>
  <g><circle cx="572" cy="244" r="15" fill="#d62728"/><text x="572" y="245" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" dominant-baseline="central">2</text></g>
</svg>
